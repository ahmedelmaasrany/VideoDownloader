name: Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android Variants
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4


      - name: Install Android SDK, NDK and CMake
        run: |
          sdkmanager \
            "platforms;android-37.1" \
            "ndk;27.3.13750724" \
            "cmake;3.22.1"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build Development Debug and Production Release
        run: |
          ./gradlew \
            :app:assembleDevelopmentDebug \
            :app:assembleProductionRelease \
            --no-daemon

      - name: Upload Development Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VideoDownloader-v1.1.0-Development-Debug
          path: app/build/outputs/apk/development/debug/app-development-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Production ARM64 APK (Unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: VideoDownloader-v1.1.0-Production-ARM64-Unsigned
          path: app/build/outputs/apk/production/release/app-production-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14
